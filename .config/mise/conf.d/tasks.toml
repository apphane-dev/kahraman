[tasks.prepare]
description = "Sync Astro generated types"
run = "astro sync"
sources = ["package.json", "astro.config.mjs", "src/**/*"]
outputs = [".astro/**/*"]

[tasks.dev]
depends = ["media"]
description = "Start the Astro development server"
usage = '''
arg "[rest]" help="Additional arguments to pass to Astro"
'''
run = "astro dev ${usage_rest}"

[tasks.build]
description = "Build the site"
depends = ["prepare", "media"]
run = ["astro build", "node --test tests/site.test.mjs"]

[tasks.check]
description = "Build and check inline media, branding, and static-site output"
depends = ["build"]

[tasks.ci]
description = "Run CI checks and build the site"
run = "mise run check"

[tasks.clean]
description = "Clean build artifacts and Astro caches"
run = "rm -rf dist .astro"

[tasks."clean:deps"]
description = "Clean installed dependencies"
run = "rm -rf node_modules"

[tasks.media]
description = "Fetch the reviewed silent film and verify its SHA-256"
run = "node scripts/prepare-media.mjs"

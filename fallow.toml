# Fallow codebase-intelligence config. Run via `pnpm run lint:fallow`
# (dead-code + dupes + health). See https://docs.fallow.tools.

# The published package entrypoints and dev/test files are the roots — exported
# public API reachable from here must not be reported as unused.
entry = [
	"src/index.ts",
	"src/preview.ts",
	"test/**/*.test.ts",
	"examples/**/*.ts",
	"vite.config.ts",
	"tsdown.config.ts",
	"jsrepo.config.ts",
]

# `storybook` is a peer dependency, resolved by consumers — not a direct import
# graph dependency to police here.
#
# Conformance packages import the workspace `kahraman` through its exports map,
# which points at dist/; before a build fallow cannot resolve it and would report
# the dependency unused.
#
# Kits list `@storybook/addon-vitest` although only the shared conformance preset
# names it: Storybook resolves the addon's setup file from the kit directory.
# MUI's default styled engine loads its Emotion peers internally. They must be
# installed by the consuming kit even though fixture code does not import them.
ignoreDependencies = [
	"storybook",
	"kahraman",
	"@storybook/addon-vitest",
	"@emotion/react",
	"@emotion/styled",
]

# Generated brand CSS is a standalone export, not part of the package module graph.
ignorePatterns = ["dist/**", "coverage/**", "brand/tokens.css"]

# shadcn CLI output stays as generated; fixtures use a subset of each component.
[[ignoreExports]]
file = "conformance/kits/shadcn/src/components/ui/*.tsx"
exports = ["*"]

[duplicates]
ignoreImports = true
# Storybook indexes story tests only as literal top-level `Story.test` calls, so
# each kit's conformance stories repeat the same declarations.
ignore = ["conformance/kits/*/src/conformance.stories.*"]

# actor.ts and preview.ts run only inside a Storybook browser context, so the
# unit tests do not cover them; the conformance suite exercises them in a
# browser, outside fallow's view. Fallow estimates coverage from the module graph when no coverage
# data is supplied, which inflates CRAP for these functions even though their
# raw complexity is low (elementsFrom: cyclomatic 7, cognitive 6). Keep a
# visible numeric ceiling instead of a blanket suppression.
[[health.thresholdOverrides]]
files = ["src/actor.ts"]
maxCrap = 60
reason = "Browser-only runtime; not unit-covered here, so estimated CRAP is pessimistic."

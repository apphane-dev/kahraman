name: Check

# Builds and tests the site before merge; deploy.yml only runs after it.
on:
  pull_request:
    branches: [website]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install mise
        uses: jdx/mise-action@v2
      - name: Config mise
        run: mise settings experimental=true
      - name: Check
        run: mise run ci

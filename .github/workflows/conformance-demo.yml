name: Conformance demo

# Publishes conformance-demo.tar.gz to a prerelease for the website, which pins
# the asset by URL, SHA-256, and size.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag. Defaults to conformance-<UTC date>.
        required: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the tag and release
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter kahraman-conformance-scenarios exec playwright install --with-deps chromium

      - name: Build the bundle
        run: pnpm run conformance:demo

      - name: Smoke-test the bundle
        run: pnpm run conformance:demo:smoke

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          tag="${TAG:-conformance-$(date -u +%F)}"
          if [[ ! "$tag" =~ ^conformance-[0-9A-Za-z.-]+$ ]]; then
            echo "::error::Tag must look like conformance-<date>, got $tag"
            exit 1
          fi
          sha256="$(sha256sum conformance-demo.tar.gz | cut -d' ' -f1)"
          size="$(stat -c %s conformance-demo.tar.gz)"
          notes="Static Storybook per conformance kit plus matrix.json, built from ${GITHUB_SHA}.

          - SHA-256: \`${sha256}\`
          - Size: ${size} bytes"
          gh release create "$tag" conformance-demo.tar.gz \
            --target "$GITHUB_SHA" --prerelease \
            --title "Conformance demo ${tag#conformance-}" --notes "$notes"
          {
            echo "### $tag"
            echo
            echo "- URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/conformance-demo.tar.gz"
            echo "- SHA-256: \`${sha256}\`"
            echo "- Size: ${size} bytes"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"

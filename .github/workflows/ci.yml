name: CI

on:
  push:
    branches: [main]
  # Any base, so each PR in a stack gets its own run.
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install outline tooling
        run: python -m pip install fonttools==4.60.1
      - name: Check generated vectors
        run: python brand/scripts/generate.py --check
      - name: Check geometry, accessibility, and contrast
        run: python -m unittest discover -s brand/scripts -p 'test_*.py' -v

  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (TypeScript 7 native)
        run: pnpm run typecheck

      - name: Lint (oxlint)
        run: pnpm run lint

      - name: Codebase intelligence (fallow)
        run: pnpm run lint:fallow

      - name: Format (oxfmt)
        run: pnpm run format

      - name: Test (vitest)
        run: pnpm run test

      - name: Build (tsdown)
        run: pnpm run build

      - name: Publish lint (publint)
        run: pnpm run publint

      - name: Types lint (are-the-types-wrong)
        run: pnpm run attw

      - name: Registry manifest is up to date (jsrepo)
        run: |
          pnpm run registry:build
          git diff --exit-code registry.json

      - name: Conformance matrix is up to date
        run: |
          pnpm run conformance:matrix
          git diff --exit-code conformance/MATRIX.md

  storybook-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        storybook-version: ['9.1.20', '10.6.1']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Use Storybook ${{ matrix.storybook-version }}
        run: pnpm add -w --save-dev storybook@${{ matrix.storybook-version }}

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kit: [react-aria, shadcn, mui, ark, vuetify, web-awesome]
    defaults:
      run:
        working-directory: conformance/kits/${{ matrix.kit }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Kit fixtures resolve kahraman through its exports map, so they test dist.
      - name: Build kahraman
        run: pnpm --dir ../../.. run build

      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Typecheck
        run: pnpm run typecheck

      - name: Conformance
        run: pnpm run test
